<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animation Template</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1280px;
      height: 720px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
      animation: fadeIn 1s ease-in-out;
    }

    .title {
      font-size: 48px;
      color: #fff;
      margin-bottom: 20px;
      text-shadow: 0 0 20px rgba(100, 200, 255, 0.5);
      animation: slideIn 1.5s ease-out;
    }

    .subtitle {
      font-size: 24px;
      color: rgba(255, 255, 255, 0.8);
      animation: slideIn 1.5s ease-out 0.3s both;
    }

    .animation-box {
      width: 300px;
      height: 300px;
      margin: 40px auto;
      background: linear-gradient(45deg, #667eea 0%, #764ba2 100%);
      border-radius: 20px;
      animation: pulse 2s ease-in-out infinite, rotate 10s linear infinite;
      box-shadow: 0 0 40px rgba(102, 126, 234, 0.6);
    }

    .floating-elements {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .float {
      position: absolute;
      background: rgba(100, 200, 255, 0.3);
      border-radius: 50%;
      animation: floatUp 8s ease-in-out infinite;
    }

    .float:nth-child(1) { width: 50px; height: 50px; left: 10%; animation-delay: 0s; }
    .float:nth-child(2) { width: 30px; height: 30px; left: 25%; animation-delay: 2s; }
    .float:nth-child(3) { width: 40px; height: 40px; left: 40%; animation-delay: 4s; }
    .float:nth-child(4) { width: 60px; height: 60px; left: 55%; animation-delay: 1s; }
    .float:nth-child(5) { width: 35px; height: 35px; left: 70%; animation-delay: 3s; }
    .float:nth-child(6) { width: 45px; height: 45px; left: 85%; animation-delay: 5s; }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes floatUp {
      0%, 100% {
        transform: translateY(720px) scale(1);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-50px) scale(0.5);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="floating-elements">
    <div class="float"></div>
    <div class="float"></div>
    <div class="float"></div>
    <div class="float"></div>
    <div class="float"></div>
    <div class="float"></div>
  </div>

  <div class="container">
    <h1 class="title">Animation Template</h1>
    <p class="subtitle">HTML to Video Conversion</p>
    <div class="animation-box"></div>
  </div>
</body>
</html>
